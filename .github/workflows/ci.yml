name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} On ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Set Up pnpm
        uses: pnpm/action-setup@v4
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check Formatting
        if: runner.os == 'Linux' && matrix.node == 22
        run: pnpm format:check
      - name: Install epubcheck
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.2.1/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Run Tests
        run: pnpm test
      - name: Pack Smoke Test
        run: pnpm pack:check
