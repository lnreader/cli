name: Release

# On every push to main, changesets/action either:
#   - opens (or updates) a "Version Packages" PR when there are pending
#     changesets in .changeset/, or
#   - publishes every package whose version is not on npm yet, once that PR
#     has been merged, and pushes the git tags.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # npm trusted publishing (OIDC) and provenance attestations.
  id-token: write
  # Push the version commit, the git tags and GitHub releases.
  contents: write
  # Open and update the "Version Packages" PR.
  pull-requests: write

jobs:
  release:
    name: Version Or Publish
    runs-on: ubuntu-latest
    # Never run in forks.
    if: github.repository == 'lnreader/cli'
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Up pnpm
        uses: pnpm/action-setup@v4
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack Smoke Test
        run: pnpm pack:check

      # Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret.
      # npm exchanges this job's OIDC token for a short-lived publish token
      # and attaches a provenance attestation automatically.
      #
      # One-time setup on npmjs.com, for EACH package (@lnreader/cli,
      # @lnreader/plugin-runtime, @lnreader/cli-browser):
      #   Package page -> Settings -> Trusted Publisher -> GitHub Actions
      #     Organization or user: lnreader
      #     Repository:           cli
      #     Workflow filename:    release.yml
      #     Environment:          (leave empty)
      # A trusted publisher can only be added once the package exists on npm,
      # so the very first publish of each package uses a temporary granular
      # token instead; see RELEASING.md.
      - name: Create Version PR Or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: Version Packages'
          commit: 'chore: Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback for the first publish only (see RELEASING.md): add a
          # granular token scoped to @lnreader as the NPM_TOKEN repository
          # secret, uncomment both lines, publish, then revoke the token,
          # delete the secret and comment these out again.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
