name: Plugins

# Load every upstream plugin in the sandbox to catch new `@libs/*` modules or
# loader breakage early. Does not contact any source site.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:plugins --refresh
        env:
          LNREADER_HOME: ${{ runner.temp }}/lnreader
