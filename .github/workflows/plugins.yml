name: Plugins

# Load every upstream plugin in the sandbox to catch new `@libs/*` modules or
# loader breakage early. Does not contact any source site.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  load:
    name: Load All Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Set Up pnpm
        uses: pnpm/action-setup@v4
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Load Every Plugin
        run: pnpm check:plugins --refresh
        env:
          LNREADER_HOME: ${{ runner.temp }}/lnreader
